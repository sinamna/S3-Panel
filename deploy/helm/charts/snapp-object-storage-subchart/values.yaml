snapp-object-store:
  enabled: false
  fqdn: ""
  config:
    url: ""
    address: "0.0.0.0"
    port: 8080
    log_level: "warn"
    auth_enabled: "false"
    auth_token: ""
snapp-object-store-dev:
  enabled: false
  fqdn: ""
  config:
    url: ""
    address: "0.0.0.0"
    port: 8080
    log_level: "debug"
    auth_enabled: "false"
    auth_token: ""

# Name of an existing Secret holding the credentials for auth_mode "iam".
# Mounted with envFrom, so its keys become environment variables:
#   s3panel_oidc__client_secret   (omit for a public OIDC client)
#   s3panel_oidc__cookie_key      (REQUIRED in iam mode; openssl rand -base64 32)
# Left empty the container gets no env, which is correct for auth_mode "s3".
existingSecret: ""

# Render this chart's own HTTPProxy. Disable when another HTTPProxy routes to the
# Service, e.g. the panel served at a path prefix of IAM's console host.
httpproxy:
  enabled: true
  # Serve the panel under this prefix of its own host (e.g. "/s3-panel", for an
  # image built with VITE_BASE_PATH=/s3-panel); "/" then redirects there. Empty
  # serves it at the root.
  pathPrefix: ""
  cors:
    # Permissive credentialed CORS for any origin. Not needed when the panel
    # serves its own frontend (same origin); turn it off then.
    enabled: true

